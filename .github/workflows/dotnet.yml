name: Static app checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify app files
        shell: bash
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js

      - name: Validate JavaScript syntax
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Parse app JavaScript
        run: node --check app.js
